# Log to both console and file
rootLogger.level = warn
rootLogger.appenderRefs = stdout, file
rootLogger.appenderRef.stdout.ref = console
rootLogger.appenderRef.file.ref = logfile

# Console appender
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# File appender
appender.file.type = File
appender.file.name = logfile
appender.file.fileName = ../logs/spark_output.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# ── RAPIDS-specific loggers (verbose) ──
logger.rapids.name = com.nvidia.spark
logger.rapids.level = debug

logger.rapidsSQL.name = com.nvidia.spark.rapids
logger.rapidsSQL.level = debug

logger.rapidsPlugin.name = com.nvidia.spark.SQLPlugin
logger.rapidsPlugin.level = debug

# ── Suppress noisy loggers ──
logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = warn
logger.jetty.additivity = false

logger.spark.name = org.apache.spark
logger.spark.level = warn
logger.spark.additivity = false

logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = warn
logger.hadoop.additivity = false

logger.parquet.name = org.apache.parquet
logger.parquet.level = warn
logger.parquet.additivity = false

logger.netty.name = io.netty
logger.netty.level = warn
logger.netty.additivity = false

logger.netty2.name = org.sparkproject.io.netty
logger.netty2.level = warn
logger.netty2.additivity = false

# Suppress CodeGenerator verbose output
logger.codegen.name = org.apache.spark.sql.catalyst.expressions.codegen
logger.codegen.level = warn
logger.codegen.additivity = false

# Suppress Spark internal scheduler noise
logger.scheduler.name = org.apache.spark.scheduler
logger.scheduler.level = warn
logger.scheduler.additivity = false

# Suppress DAGScheduler
logger.dag.name = org.apache.spark.scheduler.DAGScheduler
logger.dag.level = warn
logger.dag.additivity = false
